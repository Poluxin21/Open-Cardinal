syntax = "proto3";
package cardinal.raft;

// Peer-to-peer consensus protocol between Cardinal nodes. Every node is identified by
// the IP address the others reach it on. All calls carry `x-cardinal-auth` metadata
// (HMAC of the cluster secret); unauthenticated peers are refused.

service Raft {
  // Discovery / handshake: who are you, which cluster, who leads, who are the members.
  rpc Hello (HelloRequest) returns (HelloReply);

  rpc PreVote (VoteRequest) returns (VoteReply);
  rpc RequestVote (VoteRequest) returns (VoteReply);
  rpc AppendEntries (AppendRequest) returns (AppendReply);

  // Leader -> lagging follower: full state transfer, streamed in chunks.
  rpc InstallSnapshot (stream SnapshotChunk) returns (SnapshotReply);

  // Leadership transfer: tells the target to campaign immediately.
  rpc TimeoutNow (TimeoutNowRequest) returns (TimeoutNowReply);

  // Follower -> leader: replicate a state-machine command on behalf of a local rule/CLI.
  rpc Propose (ProposeRequest) returns (ProposeReply);

  // A node that is not (yet) a member asks the leader to add it.
  rpc Join (JoinRequest) returns (JoinReply);

  // Operator requests (forwarded to the leader): add/remove a peer, transfer leadership.
  rpc Admin (AdminRequest) returns (AdminReply);

  // Linearizable reads: the leader returns a commit index that is guaranteed to include every
  // write acknowledged before the call; the caller waits until it has applied that index.
  rpc ReadIndex (ReadIndexRequest) returns (ReadIndexReply);
}

message HelloRequest {
  string cluster_id = 1;
  string from_ip = 2;       // the caller's own IP as it believes it to be ("" if unknown)
}

message HelloReply {
  string cluster_id = 1;
  string instance_id = 2;   // stable random id of the answering node (detects "dialed myself")
  string node_ip = 3;       // IP of the answering node as configured/detected
  string observed_ip = 4;   // the caller's IP as seen by the answering node
  uint64 term = 5;
  string leader = 6;        // "" when unknown
  uint64 commit_index = 7;
  uint64 last_index = 8;
  repeated string voters = 9;
  repeated string learners = 10;
  string role = 11;         // follower | pre-candidate | candidate | leader | learner | joining
  bool bootstrapped = 12;   // has a persisted log / config (i.e. is not a blank node)
}

message VoteRequest {
  string cluster_id = 1;
  string from = 2;
  uint64 term = 3;
  uint64 last_index = 4;
  uint64 last_term = 5;
  bool transfer = 6;        // campaign caused by a leadership transfer (bypasses leader stickiness)
}

message VoteReply {
  uint64 term = 1;
  bool granted = 2;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes payload = 3;        // JSON-encoded Payload
}

message AppendRequest {
  string cluster_id = 1;
  string from = 2;
  uint64 term = 3;
  uint64 prev_index = 4;
  uint64 prev_term = 5;
  repeated LogEntry entries = 6;
  uint64 commit = 7;
}

message AppendReply {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 hint_index = 4;    // on rejection: highest index the follower may share with the leader
}

message SnapshotChunk {
  // first chunk carries the metadata
  string cluster_id = 1;
  string from = 2;
  uint64 term = 3;
  uint64 last_index = 4;
  uint64 last_term = 5;
  bytes config = 6;         // JSON ClusterConfig as of last_index
  bytes data = 7;           // slice of the JSON state dump
  bool done = 8;
}

message SnapshotReply {
  uint64 term = 1;
  bool success = 2;
  uint64 last_index = 3;
}

message TimeoutNowRequest {
  string cluster_id = 1;
  string from = 2;
  uint64 term = 3;
}

message TimeoutNowReply {
  uint64 term = 1;
}

message ProposeRequest {
  string cluster_id = 1;
  string from = 2;
  bytes command = 3;        // JSON store::Command
}

message ProposeReply {
  bool ok = 1;
  string error = 2;
  string leader_hint = 3;   // when error == "not_leader"
  bytes outcome = 4;        // JSON store::Outcome
}

message JoinRequest {
  string cluster_id = 1;
  string ip = 2;            // the address the joining node wants to be reached on
}

message JoinReply {
  bool ok = 1;
  string error = 2;
  string leader_hint = 3;
}

message AdminRequest {
  string cluster_id = 1;
  string op = 2;            // add_peer | remove_peer | transfer_leader
  string ip = 3;
}

message AdminReply {
  bool ok = 1;
  string error = 2;
  string leader_hint = 3;
  string message = 4;
}

message ReadIndexRequest {
  string cluster_id = 1;
}

message ReadIndexReply {
  bool ok = 1;
  uint64 index = 2;
  string error = 3;         // not_leader | not_ready | lease_expired
  string leader_hint = 4;
}
